<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coliber</title> <!-- Titulo de nuestro proyecto -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"> <!-- Estilos N8N -->
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/vistaAdministrador/estilosVistaAdministrador.css">

</head>

<body>

    
    <!-- Encabezado -->

    <header>

        <!-- Barra superior -->

        <div class="barra-superior">

            <a href="#inicio" class="logo">
                <img src="../../IMG/logo.png" alt="Logo Coliber">
            </a>


            <div class="acciones-superiores">

                <a href="#login" class="btn-nav usuario">
                    <i class="bi bi-person-circle"></i>
                    <span>Mi perfil</span>
                </a>

            </div>

        </div>

        <!-- Menú principal -->

        <nav class="menu-principal">

            <a href="inicioAdministrador.html">
                <span>Inicio</span>
            </a>

            <a href="productos.html" class="activo">
                <span>Productos</span>
            </a>

            <a href="pedidos.html">
                <span>Pedidos</span>
            </a>

            <a href="inventario.html">
                <span>Inventario</span>
            </a>

            <a href="usuarios.html">
                <span>Usuarios</span>
            </a>

        </nav>

    </header>
    <main>
        <section class="vista-productos" aria-labelledby="productos-titulo">
            <div class="productos-panel">
                <div class="productos-contenido">
                    <div class="productos-encabezado">
                        <h1 id="productos-titulo">Productos</h1>
                        <div class="productos-acciones" aria-label="Acciones de productos">
                            <button class="productos-boton productos-boton-principal" type="button">
                                <i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo
                            </button>
                            <button class="productos-boton productos-boton-secundario" type="button">
                                <i class="bi bi-upload" aria-hidden="true"></i> Exportar
                            </button>
                            <button class="productos-boton productos-boton-secundario" type="button">
                                <i class="bi bi-clock-history" aria-hidden="true"></i> Historial
                            </button>
                        </div>
                    </div>

                <div class="productos-filtros">
                    <label class="visually-hidden" for="buscar-producto">Buscar producto</label>
                    <input class="productos-campo" id="buscar-producto" type="search"
                        placeholder="Buscar producto">
                    <label class="visually-hidden" for="filtro-productos">Filtrar productos</label>
                    <select class="productos-campo" id="filtro-productos">
                        <option value="todos">Todos</option>
                        <option value="disponibles">Disponibles</option>
                        <option value="agotados">Sin stock</option>
                    </select>
                </div>

                <div class="productos-tabla-contenedor">
                    <table class="productos-tabla">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Foto</th>
                                <th scope="col">Categoría</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Autor</th>
                                <th scope="col">Precio</th>
                                <th scope="col">Stock</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="productos-vacio" colspan="8">
                                    No hay productos para mostrar.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="productos-paginacion">
                    <span class="productos-resumen">Mostrando 0 de 0 productos</span>
                    <nav aria-label="Paginación de productos">
                        <ul class="productos-paginacion-lista">
                            <li>
                                <button class="productos-pagina" type="button" disabled>Anterior</button>
                            </li>
                            <li>
                                <button class="productos-pagina" type="button" disabled>Siguiente</button>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
