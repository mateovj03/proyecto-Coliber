<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrador - Pedidos</title> <!-- Titulo de nuestro proyecto -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"> <!-- Estilos N8N -->
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/vistaAdministrador/estilosVistaAdministrador.css">

</head>

<body>

    
    <!-- Encabezado -->

    <header>

        <!-- Barra superior -->

        <div class="barra-superior">

            <a href="#inicio" class="logo">
                <img src="../../IMG/logo.png" alt="Logo Coliber">
            </a>


            <div class="acciones-superiores">

                <a href="#login" class="btn-nav usuario">
                    <i class="bi bi-person-circle"></i>
                    <span>Mi perfil</span>
                </a>

            </div>

        </div>

        <!-- Menú principal -->

        <nav class="menu-principal">

            <a href="inicioAdministrador.html" >
                <span>Inicio</span>
            </a>

            <a href="productos.html">
                <span>Productos</span>
            </a>

            <a href="pedidos.html" class="activo">
                <span>Pedidos</span>
            </a>

            <a href="inventario.html">
                <span>Inventario</span>
            </a>

            <a href="usuarios.html">
                <span>Usuarios</span>
            </a>

        </nav>

    </header>
    <main class="administracion-productos">
         <section class="vista-productos vista-pedidos" aria-labelledby="pedidos-titulo">
            <div class="productos-panel">
                <div class="productos-contenido">
                    <div class="productos-encabezado">
                        <span class="productos-etiqueta">Administración - Ventas</span>
                        <h1 id="pedidos-titulo">Pedidos</h1>
                        <p>Consulta los pedidos y filtro estados.</p>
                    </div>

                    <div class="productos-herramientas">
                        <div class="productos-filtros">
                            <label class="visually-hidden" for="buscar-pedido">Buscar pedido</label>
                            <input class="productos-campo" id="buscar-pedido" type="search"
                                placeholder="Buscar referencia, producto o cliente">
                            <label class="visually-hidden" for="filtro-estado">Filtrar por estado</label>
                            <select class="productos-campo" id="filtro-estado">
                                <option value="todos">Todos los estados</option>
                                <option value="Anulada">Anulada</option>
                                <option value="Cancelada">Cancelada</option>
                                <option value="Cortesía">Cortesía</option>
                                <option value="Espera">Espera</option>
                                <option value="Facturada">Facturada</option>
                                <option value="Interno">Interno</option>
                                <option value="Pagada">Pagada</option>
                            </select>
                        </div>
                        <div class="productos-acciones" aria-label="Acciones de pedidos">
                            
                            <button class="productos-boton productos-boton-secundario" type="button">
                                <i class="bi bi-upload" aria-hidden="true"></i> Exportar
                            </button>
                            <button class="productos-boton productos-boton-principal" type="button">
                                <i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo
                            </button>
                            <button class="productos-boton productos-boton-secundario" type="button">
                                <i class="bi bi-clock-history" aria-hidden="true"></i> Historial
                            </button>
                        </div>
                    </div>
 
                <div class="productos-tabla-contenedor">
                    <table class="productos-tabla">
                        <thead>
                            <tr>
                                <th scope="col">Fecha pedido</th>
                                <th scope="col">ID de referencia</th>
                                <th scope="col">Producto</th>
                                <th scope="col">Cantidad</th>
                                <th scope="col">Precio</th>
                                <th scope="col">Promo</th>
                                <th scope="col">Total</th>
                                <th scope="col">Cliente</th>
                                <th scope="col">Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="productos-vacio" colspan="9">
                                    No hay pedidos para mostrar.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
 
                <div class="productos-paginacion">
                    <span class="productos-resumen">Mostrando 0 de 0 pedidos</span>
                    <nav aria-label="Paginación de pedidos">
                        <ul class="productos-paginacion-lista">
                            <li>
                                <button class="productos-pagina" type="button" disabled>Anterior</button>
                            </li>
                            <li>
                                <button class="productos-pagina" type="button" disabled>Siguiente</button>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
            </div>
        </section>
        
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../JS/pedidos-demo.js" defer></script>  <!-- Funcionalidad para ver vista preliminar-->

</body>

</html>
