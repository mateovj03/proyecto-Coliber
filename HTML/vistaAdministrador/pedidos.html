<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coliber</title> <!-- Titulo de nuestro proyecto -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"> <!-- Estilos N8N -->
    <link rel="stylesheet" href="../../CSS/estilos.css">

</head>

<body>

    
    <!-- Encabezado -->

    <header>

        <!-- Barra superior -->

        <div class="barra-superior">

            <a href="#inicio" class="logo">
                <img src="../../IMG/logo.png" alt="Logo Coliber">
            </a>


            <div class="acciones-superiores">

                <a href="#login" class="btn-nav usuario">
                    <i class="bi bi-person-circle"></i>
                    <span>Mi perfil</span>
                </a>

            </div>

        </div>

        <!-- Menú principal -->

        <nav class="menu-principal">

            <a href="inicioAdministrador.html" >
                <span>Inicio</span>
            </a>

            <a href="productos.html">
                <span>Productos</span>
            </a>

            <a href="pedidos.html" class="activo">
                <span>Pedidos</span>
            </a>

            <a href="inventario.html">
                <span>Inventario</span>
            </a>

            <a href="usuarios.html">
                <span>Usuarios</span>
            </a>

        </nav>

    </header>
    <main>
         <section class="vista-productos" aria-labelledby="productos-titulo">
            <div class="productos-panel">
                <div class="productos-contenido">
                    <div class="productos-encabezado">
                        <h1 id="productos-titulo">Pedidos</h1>
                        <div class="productos-acciones" aria-label="Acciones de productos">
                            
                            <button class="productos-boton productos-boton-secundario" type="button">
                                <i class="bi bi-upload" aria-hidden="true"></i> Exportar
                            </button>
                            <button class="productos-boton productos-boton-principal" type="button" data-bs-toggle="modal" data-bs-target="#modalNuevoPedido">
                                <i class="bi bi-plus-lg" aria-hidden="true" ></i> Nuevo
                            </button>
                            <button class="productos-boton productos-boton-secundario" type="button">
                                <i class="bi bi-clock-history" aria-hidden="true"></i> Historial
                            </button>
                        </div>
                    </div>
 
                <div class="productos-filtros">
                    <label class="visually-hidden" for="buscar-producto">Buscar producto</label>
                    <input class="productos-campo" id="buscar-producto" type="search"
                        placeholder="Buscar producto">
                    <label class="visually-hidden" for="filtro-productos">Filtrar productos</label>
                    <select class="productos-campo" id="filtro-productos">
                        <option value="" disabled selected>Todos</option>
                        <option value="disponibles">Cliente</option>
                        <option value="agotados">Ciudad</option>
                        <option value="agotados">Estado</option>
                        <option value="agotados">Fecha</option>

                    </select>
                </div>
 
                <div class="productos-tabla-contenedor">
                    <table class="productos-tabla">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Foto</th>
                                <th scope="col">Categoría</th>
                                <th scope="col">Libro</th>
                                <th scope="col">Cliente</th>
                                <th scope="col">Precio</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Fecha</th>
                                <th scope="col">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="productos-vacio" colspan="8">
                                    No hay productos para mostrar.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
 
                <div class="productos-paginacion">
                    <span class="productos-resumen">Mostrando 0 de 0 productos</span>
                    <nav aria-label="Paginación de productos">
                        <ul class="productos-paginacion-lista">
                            <li>
                                <button class="productos-pagina" type="button" disabled>Anterior</button>
                            </li>
                            <li>
                                <button class="productos-pagina" type="button" disabled>Siguiente</button>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
            </div>
        </section>

        
        <!-- Modal Nuevo Pedido -->
         <di class="modal" id="modalNuevoPedido" tabindex="-1" aria-labelledby="modalNuevoPedidoLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalNuevoPedidoLabel">Agregar Nuevo Pedido</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

                    <div class="modal-body">
                        <form id="formNuevoPedido">
                            <div class="row g-3">
                                <!-- ID -->
                                <div class="col-md-3">
                                    <label for="pedidoId" class="form-label">ID</label>
                                    <input type="text" class="form-control" id="pedidoId" placeholder="Ej. #001" required>
                                </div>

                                <!-- foto libro -->
                                 <div class="col-md-9">
                                    <label class="form-label">Foto Portada del libro</label>
                                    <ul class="nav nav-tabs mb-2" id="fotoTab" role="tablist">
                                        <li class="nav-item" role="presentation">
                                            <button class="nav-link active py-1 px-2 small" id="archivo-tab" data-bs-toggle="tab" data-bs-target="#archivo-pane" type="button" role="tab" >Subir archivo</button>
                                        </li>
                                        <li class="nav-item" role="presentation">
                                            <button class="nav-link py-1 px-2 small" id="url-tab" data-bs-toggle="tab" data-bs-target="#url-pane" type="button" role="tab">Usar URL</button>
                                        </li>
                                    </ul>
                                    <div class="tab-content" id="fotoTabContent">
                                        <div class="tab-pane fade show active" id="archivo-pane" role="tabpanel">
                                            <input type="file" class="form-control" id="pedidoFotoArchivo" accept="image/*">
                                        </div>
                                        <div class="tab-pane fade" id="url-pane" role="tabpanel" >
                                            <input type="url" class="form-control" id="pedidoFotoUrl" placeholder="https://ejemplo.com/portada.jpg">
                                        </div>
                                    </div>
                                 </div>

                                <!-- categoria -->
                                 <div class="col-md-6">
                                    <label for="pedidoCategoria" class="form-label">Categoría</label>
                                    <select class="form-select" id="pedidoCategoria" required>
                                        <option value="" selected disabled>Seleccione una Categoría...</option>
                                        <option value="Ciencia y Tecnologìa">Ciencia y Tecnologìa</option>
                                        <option value="Literatura Infantil">Literatura Infantil</option>
                                        <option value="Ciencia Sociales y Humanidades">Ciencia Sociales y Humanidades</option>
                                        <option value="Desarrollo Personal y Bienestar">Desarrollo Personal y Bienestar</option>
                                        <option value="Arte y Creatividad">Arte y Creatividad</option>
                                        <option value="Literatura">Literatura</option>
                                        <option value="Religion y Espiritualidad">Religion y Espiritualidad</option>
                                        <option value="Economìa y Emprendimiento">Economìa y Emprendimiento</option>
                                    </select>
                                 </div>

                                <!-- Nombre libro -->
                                <div class="col-md-6">
                                    <label for="pedidoLibro" class="form-label">Nombre del libro</label>
                                    <input type="text" class="form-control" id="pedidoLibro" placeholder="Título del libro" required>
                                </div>

                                <!-- nombre cliente -->
                                <div class="col-md-6">
                                    <label for="pedidoCliente" class="form-label">Nombre del Cliente</label>
                                    <input type="text" class="form-control" id="pedidoCliente" placeholder="Nombre completo del comprador" required>
                                </div>

                                <!-- precio -->
                                 <div class="col-md-6">
                                    <label for="pedidoPrecio" class="form-label">Precio</label>
                                    <input type="text" class="form-control" id="pedidoPrecio" placeholder="Ej. $ 45.000" required>
                                </div>

                                <!-- estado -->
                                <div class="col-md-4">
                                    <label for="pedidoEstado" class="form-label">Estado del pedido</label>
                                    <select class="form-select" id="pedidoEstado" required>
                                        <option value="Pendiente" selected>Pendiente</option>
                                        <option value="Procesando">Procesando</option>
                                        <option value="Completado">Completado</option>
                                        <option value="Cancelado">Cancelado</option>
                                        
                                    </select>
                                </div>

                                <!-- fecha -->
                                <div class="col-md-4">
                                    <label for="pedidoFecha" class="form-label">Fecha</label>
                                    <input type="date" class="form-control" id="pedidoFecha" required>
                                </div>

                                <!-- total -->
                                <div class="col-md-4">
                                    <label for="pedidoTotal" class="form-label">Total</label>
                                    <input type="text" class="form-control" id="pedidoTotal" placeholder="Ej. $ 45.000" required>
                                </div>

                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" form="formNuevoPedido" class="btn btn-primary">Guardar pedido</button>
                    </div>

                </div>
            </div>
         </div>
        
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
